<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Red Brand Gradient Background -->
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1A27"/>
      <stop offset="100%" stop-color="#99000C"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#redGrad)"/>
  
  <!-- Soundwave vertical bars (white) -->
  <rect x="18" y="42" width="6" height="16" rx="3" fill="#FFFFFF"/>
  <rect x="28" y="32" width="6" height="36" rx="3" fill="#FFFFFF"/>
  <rect x="38" y="24" width="6" height="52" rx="3" fill="#FFFFFF"/>
  <rect x="48" y="32" width="6" height="36" rx="3" fill="#FFFFFF"/>
  <rect x="58" y="42" width="6" height="16" rx="3" fill="#FFFFFF"/>

  <!-- Yellow Gold FM circular badge -->
  <circle cx="76" cy="50" r="15" fill="#F5B82E"/>
  <text x="76" y="55" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" text-anchor="middle">FM</text>
</svg>
